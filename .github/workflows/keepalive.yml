name: keep app awake

on:
  schedule:
    - cron: "17 */8 * * *"  # every 8 hours; Community Cloud sleeps an app after about 12 hours without visitors
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python keepalive.py
